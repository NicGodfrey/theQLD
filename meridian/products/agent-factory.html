<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Factory — MERIDIAN</title>
  <link rel="stylesheet" href="../css/studio.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html">MERIDIAN<span>.</span></a>
      <nav class="topnav"><a href="../index.html">工作室</a><a href="proxy-gate.html">Gate</a><a href="lovara.html">Lovara</a></nav>
      <button class="btn btn-acid" id="buildBtn" type="button">打包 Agent Pack</button>
    </header>
    <div class="page-head">
      <h1>Agent Factory</h1>
      <p>把创作 / 营销 / 内容 / 运营工作流与反代路由打成可分发的 Agent Pack。</p>
    </div>
    <div class="workspace">
      <aside class="panel">
        <div class="field"><label>Pack 名称</label><input id="name" value="Growth+Gateway Starter" /></div>
        <div class="field"><label>选择工作流</label>
          <label class="list-item"><input type="checkbox" value="create" checked /> Flow Create</label>
          <label class="list-item"><input type="checkbox" value="market" checked /> Flow Market</label>
          <label class="list-item"><input type="checkbox" value="content" checked /> Flow Content</label>
          <label class="list-item"><input type="checkbox" value="ops" /> Flow Ops</label>
          <label class="list-item"><input type="checkbox" value="lovara" checked /> Lovara</label>
          <label class="list-item"><input type="checkbox" value="canvas" /> Canvas Studio</label>
        </div>
        <div class="field"><label>绑定反代</label>
          <select id="proxy">
            <option value="gate">Proxy Gate</option>
            <option value="router">Proxy Router</option>
            <option value="tunnel">Proxy Tunnel</option>
            <option value="gate+router">Gate + Router</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="installBtn" type="button">安装到本地库</button>
          <button class="btn btn-ghost" id="exportBtn" type="button">导出 JSON</button>
        </div>
      </aside>
      <main class="panel">
        <h3>Pack 预览</h3>
        <div class="output" id="preview"></div>
        <h3 style="margin-top:1rem">已安装 Packs</h3>
        <div id="library" class="list"></div>
      </main>
    </div>
  </div>
  <script src="../js/core.js"></script>
  <script src="../js/agent-factory.js"></script>
</body>
</html>
