<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flow Content — MERIDIAN</title>
  <link rel="stylesheet" href="../css/studio.css" />
  <style>.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}.tabs button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:.45rem .9rem;cursor:pointer;font-weight:600}.tabs button.active{background:var(--ink);color:var(--foam)}.tabpane{display:none}.tabpane.active{display:block}</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html">MERIDIAN<span>.</span></a>
      <nav class="topnav"><a href="../index.html">工作室</a><a href="flow-market.html">营销</a><a href="flow-ops.html">运营</a></nav>
      <button class="btn btn-acid" id="genBtn" type="button">生成全套内容</button>
    </header>
    <div class="page-head">
      <h1>Flow Content</h1>
      <p>AI 内容工作流：选题 → 大纲 → 长文 → 社交切片 → SEO，一键打包导出。</p>
    </div>
    
    <div class="workspace">
      <aside class="panel">
        <div class="field"><label>选题</label><input id="topic" value="如何用反代网关把多模型成本打下来" /></div>
        <div class="field"><label>主关键词</label><input id="keyword" value="AI 反代网关" /></div>
        <div class="field"><label>字数目标</label><input id="words" type="number" value="1200" /></div>
        <div class="field"><label>关键词密度辅助</label><div class="muted" id="density">生成后计算</div></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="exportBtn" type="button">导出多文件</button>
          <button class="btn btn-ghost" id="saveBtn" type="button">保存</button>
        </div>
      </aside>
      <main class="panel">
        <div class="tabs" id="tabs">
          <button type="button" data-tab="outline" class="active">大纲</button>
          <button type="button" data-tab="longform">长文</button>
          <button type="button" data-tab="social">社交切片</button>
          <button type="button" data-tab="seo">SEO</button>
        </div>
        <div class="tabpane active" id="outline"><div class="output" id="out-outline">待生成</div></div>
        <div class="tabpane" id="longform"><div class="output" id="out-longform">待生成</div></div>
        <div class="tabpane" id="social"><div class="output" id="out-social">待生成</div></div>
        <div class="tabpane" id="seo"><div class="output" id="out-seo">待生成</div></div>
      </main>
    </div>
  </div>
  <script src="../js/core.js"></script>
  <script src="../js/flow-content.js"></script>
</body>
</html>
