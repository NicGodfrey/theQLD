<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proxy Gate — MERIDIAN</title>
  <link rel="stylesheet" href="../css/studio.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html">MERIDIAN<span>.</span></a>
      <nav class="topnav"><a href="proxy-router.html">Router</a><a href="proxy-tunnel.html">Tunnel</a><a href="agent-factory.html">Factory</a></nav>
      <button class="btn btn-acid" id="exportBtn" type="button">导出网关配置</button>
    </header>
    <div class="page-head">
      <h1>Proxy Gate</h1>
      <p>AI API 反代网关：上游、路由、密钥、限流与可运行的 Nginx / Compose 配置。</p>
    </div>
    <div class="workspace">
      <aside class="panel">
        <h3>上游 Provider</h3>
        <div id="providers" class="list"></div>
        <div class="btn-row" style="margin-top:.6rem"><button class="btn btn-ghost" id="addProvider" type="button">+ Provider</button></div>
        <div class="field" style="margin-top:1rem"><label>对外路径</label><input id="path" value="/v1/chat/completions" /></div>
        <div class="field"><label>Rate limit / 分</label><input id="rpm" type="number" value="60" /></div>
        <div class="field"><label>IP 允许（逗号分隔）</label><input id="allow" value="10.0.0.0/8,192.168.0.0/16" /></div>
        <div class="field"><label>网关密钥（本地保存）</label><input id="gateKey" type="password" placeholder="sk-meridian-..." /></div>
        <button class="btn btn-ghost" id="simBtn" type="button">模拟 5 条请求日志</button>
      </aside>
      <main class="panel">
        <h3>路由表</h3>
        <div id="routes" class="list"></div>
        <h3 style="margin-top:1rem">请求日志</h3>
        <div class="output" id="logs">暂无</div>
        <h3 style="margin-top:1rem">导出预览</h3>
        <div class="output" id="preview"></div>
      </main>
    </div>
  </div>
  <script src="../js/core.js"></script>
  <script src="../js/proxy-gate.js"></script>
</body>
</html>
