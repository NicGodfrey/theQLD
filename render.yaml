services:
  - type: web
    name: theqld-claude-api-proxy
    runtime: docker
    plan: starter
    dockerfilePath: ./claude-api-proxy/Dockerfile
    dockerContext: ./claude-api-proxy
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_PROXY_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        value: https://api.anthropic.com
